name: CI

on:
  pull_request:
  push:
    branches: [main]
  # "Run workflow" on main redeploys and re-registers the webhook,
  # e.g. after rotating WEBHOOK_SECRET.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run smoke

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    # One deploy at a time; a newer push waits for the running one instead of cancelling it.
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          # The secret ships with the new version itself, so code and secret change together.
          secrets_file="$RUNNER_TEMP/worker-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          jq -n '{WEBHOOK_SECRET: env.WEBHOOK_SECRET}' > "$secrets_file"
          npx wrangler deploy --secrets-file "$secrets_file"

      - name: Find Worker URL
        id: worker
        run: |
          url=$(jq -r 'select(.type == "deploy") | .targets[]? | select(endswith(".workers.dev"))' \
            "$RUNNER_TEMP/wrangler-output.ndjson" | head -n 1)
          if [ -z "$url" ]; then
            echo "::error::wrangler deploy did not report a workers.dev URL"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Register Telegram webhook
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          WORKER_URL: ${{ steps.worker.outputs.url }}
        run: node scripts/telegram.ts set-webhook "$WORKER_URL"
